name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Typecheck (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Tests (Windows)
    # The CLI suite shells out through bash and the E-drive stress test needs a
    # second volume, so the full run lives on Windows for now.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run smoke
      - run: npm run test:stress
      - name: Adversarial passes
        run: node test/harden.mjs --passes 15

  gui:
    name: GUI smoke (Windows, bundled server)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the bundled server
        run: node scripts/build-gui.mjs
      - name: Drive the window over HTTP/SSE
        run: node test/gui-smoke.mjs --bundle
