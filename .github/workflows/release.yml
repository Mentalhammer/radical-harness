name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check before shipping
        run: |
          npm run typecheck
          npm run test:unit
          npm run smoke

      - name: Package VaelenGUI.exe
        run: npm run exe

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash VaelenGUI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VaelenGUI.exe" | Out-File -Encoding ascii VaelenGUI.exe.sha256
          Get-Content VaelenGUI.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: VaelenGUI-windows
          path: |
            VaelenGUI.exe
            VaelenGUI.exe.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VaelenGUI.exe
            VaelenGUI.exe.sha256
          generate_release_notes: true
          body: |
            Windows build, unsigned: SmartScreen will warn on first run. Build it
            yourself with `npm run exe` if you would rather not trust the binary.
            Verify the download against `VaelenGUI.exe.sha256`.

            The executable embeds a Node.js runtime; see THIRD-PARTY-NOTICES.md.
